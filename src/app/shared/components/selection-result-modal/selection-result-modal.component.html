<h2 mat-dialog-title>
  {{ data.content.title }}
</h2>

<mat-dialog-content>
  <div class="content-edit">
    <img class="content-image" [src]="data.content.image" alt="">
    <p>
      {{ data.content.text }}
    </p>
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end">

  <button mat-button mat-dialog-close>
    Close
  </button>

</mat-dialog-actions>
