<div class="score-container">
  <h2>High Scores</h2>
  <ul>

    @if(globalUsers?.length === 0) {
        <p>No scores yet. Play the game to set a new high score!</p>
    }@else{
       @for(user of globalUsers; track user.username; let i = $index) { 
        <li>
           <p>
            @if(user.isActive){
              <strong>(Your score)</strong>
            }
             {{ user.username }} - {{ user.score }}</p>
        </li>
      } 
    }   
  </ul>
</div>
